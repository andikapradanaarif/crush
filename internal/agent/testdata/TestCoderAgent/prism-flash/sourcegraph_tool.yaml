tFlags: command.Flags(flax.MustBind, \u0026runConfig),\n\t\t\t\tRun:      runIntegrationTest,\n\t\t\t},\n\t\t\t{\n\t\t\t\tName: \"doctor\",\n\t\t\t\tHelp: \"Check system requirements for running integration tests\",\n\t\t\t\tRun: func(env *command.Env) error {\n\t\t\t\t\treturn runDoctorCheck(env.Context())\n\t\t\t\t},\n\t\t\t},\n\t\t\t{\n\t\t\t\tName:     \"list-versions\",\n\t\t\t\tHelp:     \"Print Tailscale versions used by integration tests\",\n\t\t\t\tUsage:    \"list-versions [flags]\",\n\t\t\t\tSetFlags: command.Flags(flax.MustBind, \u0026listVersionsConfig),\n\t\t\t\tRun:      listVersions,\n\t\t\t},\n\t\t\t{\n\t\t\t\tName: \"clean\",\n\t\t\t\tHelp: \"Clean Docker resources\",\n\t\t\t\tCommands: []*command.C{\n\t\t\t\t\t{\n\t\t\t\t\t\tName: \"networks\",\n\t\t\t\t\t\tHelp: \"Prune unused Docker networks\",\n\t\t\t\t\t\tRun: func(env *command.Env) error {\n\t\t\t\t\t\t\treturn pruneDockerNetworks(env.Context())\n\t\t\t\t\t\t},\n\t\t\t\t\t},\n\t\t\t\t\t{\n\t\t\t\t\t\tName: \"images\",\n\t\t\t\t\t\tHelp: \"Clean old test images\",\n\t\t\t\t\t\tRun: func(env *command.Env) error {\n\t\t\t\t\t\t\treturn cleanOldImages(env.Context())\n\t\t\t\t\t\t},\n\t\t\t\t\t},\n\t\t\t\t\t{\n\t\t\t\t\t\tName: \"containers\",\n\t\t\t\t\t\tHelp: \"Kill all test containers\",\n\t\t\t\t\t\tRun: func(env *command.Env) error {\n\t\t\t\t\t\t\treturn killTestContainers(env.Context())\n\t\t\t\t\t\t},\n\t\t\t\t\t},\n\t\t\t\t\t{\n\t\t\t\t\t\tName: \"cache\",\n\t\t\t\t\t\tHelp: \"Clean Go module cache volume\",\n\t\t\t\t\t\tRun: func(env *command.Env) error {\n\t\t\t\t\t\t\treturn cleanCacheVolume(env.Context())\n\t\t\t\t\t\t},\n\t\t\t\t\t},\n\t\t\t\t\t{\n\t\t\t\t\t\tName: \"all\",\n\t\t\t\t\t\tHelp: \"Run all cleanup operations\",\n\t\t\t\t\t\tRun: func(env *command.Env) error {\n\t\t\t\t\t\t\treturn cleanAll(env.Context())\n\t\t\t\t\t\t},\n\t\t\t\t\t},\n\t\t\t\t},\n\t\t\t},\n\t\t\tcommand.HelpCommand(nil),\n\t\t},\n\t}\n\n\tenv := root.NewEnv(nil).MergeFlags(true)\n\tcommand.RunOrFail(env, os.Args[1:])\n}\n\nfunc cleanAll(ctx context.Context) error {\n\tfor _, step := range []func(context.Context) error{\n\t\tkillTestContainers,\n\t\tpruneDockerNetworks,\n\t\tcleanOldImages,\n\t\tcleanCacheVolume,\n\t} {\n\t\terr := step(ctx)\n\t\tif err != nil {\n\t\t\treturn err\n\t\t}\n\t}\n\n\treturn nil\n}\n"},"lineMatches":[{"preview":"func main() {","lineNumber":12,"offsetAndLengths":[[0,9]]},{"preview":"package main","lineNumber":0,"offsetAndLengths":[[8,4]]},{"preview":"\t\t\t\tRun: func(env *command.Env) error {","lineNumber":27,"offsetAndLengths":[[9,4]]},{"preview":"\t\t\t\t\t\tRun: func(env *command.Env) error {","lineNumber":45,"offsetAndLengths":[[11,4]]},{"preview":"\t\t\t\t\t\tRun: func(env *command.Env) error {","lineNumber":52,"offsetAndLengths":[[11,4]]},{"preview":"\t\t\t\t\t\tRun: func(env *command.Env) error {","lineNumber":59,"offsetAndLengths":[[11,4]]},{"preview":"\t\t\t\t\t\tRun: func(env *command.Env) error {","lineNumber":66,"offsetAndLengths":[[11,4]]},{"preview":"\t\t\t\t\t\tRun: func(env *command.Env) error {","lineNumber":73,"offsetAndLengths":[[11,4]]},{"preview":"func cleanAll(ctx context.Context) error {","lineNumber":87,"offsetAndLengths":[[0,4]]},{"preview":"\tfor _, step := range []func(context.Context) error{","lineNumber":88,"offsetAndLengths":[[24,4]]}]},{"__typename":"FileMatch","repository":{"name":"github.com/mattn/go-generics-example"},"file":{"path":"foreach/main.go","url":"/r/github.com/mattn/go-generics-example/-/blob/foreach/main.go","content":"package main\n\nimport (\n\t\"fmt\"\n)\n\nfunc eachFunc[T any](a []T, f func(T) bool) {\n\tfor _, e := range a {\n\t\tif !f(e) {\n\t\t\tbreak\n\t\t}\n\t}\n}\n\nfunc main() {\n\teachFunc([]int{1, 2, 3, 4, 5, 6}, func(v int) bool {\n\t\tfmt.Println(v)\n\t\treturn v \u003c 4\n\t})\n\teachFunc([]string{\"foo\", \"bar\", \"\", \"zoo\"}, func(v string) bool {\n\t\tfmt.Println(v)\n\t\treturn v != \"\"\n\t})\n}\n"},"lineMatches":[{"preview":"func main() {","lineNumber":14,"offsetAndLengths":[[0,9]]},{"preview":"\teachFunc([]int{1, 2, 3, 4, 5, 6}, func(v int) bool {","lineNumber":15,"offsetAndLengths":[[5,4],[35,4]]},{"preview":"package main","lineNumber":0,"offsetAndLengths":[[8,4]]},{"preview":"func eachFunc[T any](a []T, f func(T) bool) {","lineNumber":6,"offsetAndLengths":[[0,4],[9,4],[30,4]]},{"preview":"\teachFunc([]string{\"foo\", \"bar\", \"\", \"zoo\"}, func(v string) bool {","lineNumber":19,"offsetAndLengths":[[5,4],[45,4]]}]},{"__typename":"FileMatch","repository":{"name":"github.com/mattn/go-generics-example"},"file":{"path":"filter/main.go","url":"/r/github.com/mattn/go-generics-example/-/blob/filter/main.go","content":"package main\n\nimport (\n\t\"fmt\"\n)\n\nfunc filterFunc[T any](a []T, f func(T) bool) []T {\n\tvar n []T\n\tfor _, e := range a {\n\t\tif f(e) {\n\t\t\tn = append(n, e)\n\t\t}\n\t}\n\treturn n\n}\n\nfunc main() {\n\tvi := []int{1, 2, 3, 4, 5, 6}\n\tvi = filterFunc(vi, func(v int) bool {\n\t\treturn v \u003c 4\n\t})\n\tfmt.Println(vi)\n}\n"},"lineMatches":[{"preview":"func main() {","lineNumber":16,"offsetAndLengths":[[0,9]]},{"preview":"\tvi = filterFunc(vi, func(v int) bool {","lineNumber":18,"offsetAndLengths":[[12,4],[21,4]]}]}]}}}}'
