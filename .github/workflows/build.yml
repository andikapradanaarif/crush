name: build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # macos-latest jobs were being cancelled at ~15m; give the
    # build+test step explicit headroom instead of relying on the
    # platform default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code
      - run: go build -race ./...
      # -short keeps the gate hermetic: realrepo-* quarantine cells
      # clone+build a pinned repo (observed 850s+ under load) and can
      # starve siblings past the 10m package timeout (#138). -timeout
      # doubles the per-package ceiling: internal/agent alone runs
      # ~520s under -race on windows-latest (87% of the 10m default)
      # and any test growth tips the package into a timeout panic.
      - run: go test -race -failfast -short -timeout 20m ./...
